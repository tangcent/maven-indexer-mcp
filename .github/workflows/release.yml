name: Release

# Fires on the tag that scripts/release.sh pushes. The main-branch trigger was
# removed: it gated on the commit message and then bailed out whenever the tag
# already existed — which release.sh guarantees, so no release was ever created.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # --generate-notes walks the tag history, so it needs the full clone.
          fetch-depth: 0

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # release.sh creates the release itself right after pushing the tag.
          # This job is only a backstop for runs where that step was skipped or
          # failed — a tag existing proves nothing about a release existing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # Not a draft, not a prerelease: it must show up on the Releases page.
          gh release create "$TAG" --title "$TAG" --generate-notes
